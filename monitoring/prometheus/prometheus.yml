global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerting-rules.yml"

scrape_configs:
  - job_name: "tws-app"
    scrape_interval: 10s
    metrics_path: "/metrics"
    static_configs:
      - targets: ["app:8080"]
        labels:
          service: "text-watermark-studio"
          env: "development"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
