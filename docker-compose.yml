services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  app:
    build: .
    env_file:
      - .env
    environment:
      AI_WM_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
  worker:
    build: .
    command: ["python", "-m", "ai_watermark_toolkit.workers.streams_worker"]
    env_file:
      - .env
    environment:
      AI_WM_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
