services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  app:
    build: .
    environment:
      AI_WM_ENV: development
      AI_WM_REDIS_URL: redis://redis:6379/0
      AI_WM_STREAM_KEY: tws:stream:jobs
      AI_WM_DLQ_STREAM_KEY: tws:stream:jobs:dlq
      AI_WM_QUEUE_NAME: tws:queue:jobs
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
  worker:
    build: .
    command: ["python", "-m", "ai_watermark_toolkit.workers.streams_worker"]
    environment:
      AI_WM_ENV: development
      AI_WM_REDIS_URL: redis://redis:6379/0
      AI_WM_STREAM_KEY: tws:stream:jobs
      AI_WM_DLQ_STREAM_KEY: tws:stream:jobs:dlq
      AI_WM_QUEUE_NAME: tws:queue:jobs
    depends_on:
      redis:
        condition: service_healthy
