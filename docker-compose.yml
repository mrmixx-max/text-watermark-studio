services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      AI_WM_ENV: development
      AI_WM_REDIS_URL: redis://redis:6379/0
      AI_WM_STREAM_KEY: tws:stream:jobs
      AI_WM_DLQ_STREAM_KEY: tws:stream:jobs:dlq
      AI_WM_QUEUE_NAME: tws:queue:jobs
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "ai_watermark_toolkit.workers.streams_worker"]
    environment:
      AI_WM_ENV: development
      AI_WM_REDIS_URL: redis://redis:6379/0
      AI_WM_STREAM_KEY: tws:stream:jobs
      AI_WM_DLQ_STREAM_KEY: tws:stream:jobs:dlq
      AI_WM_QUEUE_NAME: tws:queue:jobs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

volumes:
  redis-data:
