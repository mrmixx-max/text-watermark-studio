name: debug-routes

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] --quiet
      - name: Isolated v130
        run: pytest tests/test_v130_api_security.py -q --timeout=120 || true
      - name: Route count after isolated run
        run: |
          python - <<'EOF'
          from ai_watermark_toolkit.api.fastapi_app import app
          print("ROUTES_AFTER_ISOLATED", len(app.routes))
          EOF
