name: debug-routes

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] --quiet
      - name: Dump routes
        run: |
          python - <<'EOF'
          import ai_watermark_toolkit.api.fastapi_app as fapp
          app = fapp.app
          print("AFTER_IMPORT", len(app.routes))
          print("TEXT_ROUTER", len(fapp.text_router.routes))
          print("HAS_ATTR_TEXT_ROUTER", hasattr(fapp, "text_router"))
          # try including manually right now
          app.include_router(fapp.text_router)
          print("AFTER_MANUAL_INCLUDE", len(app.routes))
          for r in app.routes:
              print("R", getattr(r, "path", "?"))
          EOF
