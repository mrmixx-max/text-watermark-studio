name: debug-routes

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] --quiet
      - name: Dump routes
        run: |
          python - <<'EOF'
          from ai_watermark_toolkit.api.fastapi_app import app
          paths = sorted({r.path for r in app.routes if hasattr(r, 'methods')})
          print("TOTAL_ROUTES", len(paths))
          for p in paths:
              print(p)
          EOF
