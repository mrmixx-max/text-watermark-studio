name: debug-routes

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] --quiet
      - name: Dump routes
        run: |
          python - <<'EOF'
          import ai_watermark_toolkit, sys
          print("PKG_FILE", ai_watermark_toolkit.__file__)
          import ai_watermark_toolkit.api.fastapi_app as fapp
          print("APP_FILE", fapp.__file__)
          from ai_watermark_toolkit.api.routes.text import router as tr
          print("TEXT_ROUTER_ROUTES", len(tr.routes))
          from ai_watermark_toolkit.api.routes.forensics import router as fr
          print("FORENSICS_ROUTER_ROUTES", len(fr.routes))
          from ai_watermark_toolkit.api.fastapi_app import app
          paths = sorted({r.path for r in app.routes if hasattr(r, 'methods')})
          print("TOTAL_ROUTES", len(paths))
          for p in paths:
              print("R", p)
          EOF
