name: Benchmarks & Watermark Interop

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install -e .
          pip install pytest markllm
      - name: Run watermark benchmarks
        run: |
          python -m pytest tests/perf/test_watermark_perf.py -v 2>&1 | tee tests/perf/benchmark.log
      - name: Run MarkLLM interop check
        run: |
          python -c "
          import sys
          try:
              import markllm
              from ai_watermark_toolkit.forensics.kgw import mark_greenlist, detect_kgw
              txt = ('Benchmark sample text for watermark interop verification. ' * 20).strip()
              key = 'benchmark-key-12345'
              wm = mark_greenlist(txt, key)['text']
              res = detect_kgw(wm, key)
              assert res['verdict'] == 'watermark_detected', f'Interop failed: {res}'
              print('KGW round-trip interop: OK (z=%.2f)' % res['z_score'])
          except Exception as e:
              print('Interop skipped:', e)
              sys.exit(0)
          "
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: tests/perf/*.log