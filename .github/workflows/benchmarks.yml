name: Benchmarks & Watermark Interop

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install -e .
          pip install pytest markllm
      - name: Run watermark benchmarks
        run: |
          python -m pytest tests/perf/test_watermark_perf.py -v
      - name: Run MarkLLM interop check
        run: |
          python -c "
          import sys
          try:
              import markllm
              from text_watermark import embed, detect
              txt = 'Benchmark sample text for watermark interop.'
              key = 'benchmark-key-12345'
              wm = embed(txt, key)
              assert detect(wm, key) == True, 'Interop failed'
              print('MarkLLM interop: OK')
          except Exception as e:
              print('Interop skipped:', e)
              sys.exit(0)
          "
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: tests/perf/*.log