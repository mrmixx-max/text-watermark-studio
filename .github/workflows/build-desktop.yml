# Build the Windows desktop app + installer (PySide6 wrapper around core).
#
# Trigger: workflow_dispatch (manual) or a v* tag push (release build).
# Produces two artifacts: dist/tws-desktop.exe (PyInstaller onefile,
# windowed) and dist/TWS-Setup.exe (Inno Setup installer).
#
# Code signing is a BUDGET DECISION, not wired in: without a certificate
# the installer is unsigned and Windows SmartScreen shows the expected
# "Unknown publisher" warning. To sign, uncomment the optional step below
# and store the certificate + password as repo secrets.

name: build-desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # PySide6 is an OPTIONAL GUI-only dependency (stdlib-first core,
          # not in pyproject); pyinstaller builds the onefile.
          pip install PySide6 pyinstaller
          pip install -e .

      - name: Build standalone exe (PyInstaller, onefile, windowed)
        run: pyinstaller packaging/tws-desktop.spec

      - name: Install Inno Setup (choco)
        run: choco install innosetup -y --no-progress

      - name: Compile installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) { & $iscc packaging/tws-setup.iss }
          else { iscc packaging/tws-setup.iss }

      # ------------------------------------------------------------------
      # OPTIONAL code signing (budget decision — see README "Desktop-App"):
      #   - Obtain a code-signing certificate (OV/EV, ~$100-300/year).
      #   - Base64-encode the .pfx and store it + the password as secrets
      #     WINDOWS_CERT_BASE64 / WINDOWS_CERT_PASSWORD.
      #   - Signing the exe BEFORE Inno packs it avoids the installer
      #     warning; signing the installer itself is the second step.
      # ------------------------------------------------------------------
      # - name: Sign binaries (optional)
      #   shell: pwsh
      #   env:
      #     CERT_B64: ${{ secrets.WINDOWS_CERT_BASE64 }}
      #     CERT_PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      #   run: |
      #     $cert = Join-Path $env:RUNNER_TEMP "cert.pfx"
      #     [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:CERT_B64))
      #     $signtool = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\signtool.exe"
      #     if (-not (Test-Path $signtool)) { $signtool = "signtool" }
      #     & $signtool sign /fd SHA256 /f $cert /p $env:CERT_PASS /tr http://timestamp.digicert.com /td SHA256 dist/tws-desktop.exe
      #     & $signtool sign /fd SHA256 /f $cert /p $env:CERT_PASS /tr http://timestamp.digicert.com /td SHA256 dist/TWS-Setup.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tws-desktop-windows
          path: |
            dist/tws-desktop.exe
            dist/TWS-Setup.exe
          if-no-files-found: error
          retention-days: 30
