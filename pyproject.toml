[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "text-watermark-studio"
version = "2.3.1"
description = "Independent, offline verification of AI text watermarks — keyed detection, marking, provenance, measurement"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Erik Gieske"}]
license = {text = "MIT"}
keywords = ["ai", "watermark", "unicode", "text-cleaning", "forensics", "cli"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "python-dotenv>=1.0", "redis>=5.0", "arq>=0.26", "prometheus-client>=0.20", "python-multipart>=0.0.9"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "build>=1.2", "twine>=5.1", "pytest-timeout>=2.2", "tiktoken>=0.7", "markdown>=3.5"]
bpe = ["tiktoken>=0.7"]
tui = ["textual>=8.0"]
# MarkLLM interop (reference-compatible KGW detection); heavy: pulls torch/transformers
markllm = ["markllm==0.1.5"]

[project.scripts]
ai-wm = "ai_watermark_toolkit.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
