[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "text-watermark-studio"
version = "2.4.1"
description = "Independent, offline verification of AI text watermarks — keyed detection, marking, provenance, measurement"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Erik Gieske"}]
license = {text = "MIT"}
keywords = ["ai", "watermark", "unicode", "text-cleaning", "forensics", "cli"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Software Development :: Libraries",
  "Topic :: Security :: Cryptography",
  "Operating System :: OS Independent",
]
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "python-dotenv>=1.0", "redis>=5.0", "arq>=0.26", "prometheus-client>=0.20", "python-multipart>=0.0.9"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "build>=1.2", "twine>=5.1", "pytest-timeout>=2.2", "tiktoken>=0.7", "markdown>=3.5", "pytest-cov>=5.0", "ruff>=0.6", "bandit>=1.7"]
bpe = ["tiktoken>=0.7"]
tui = ["textual>=8.0"]
# MarkLLM interop (reference-compatible KGW detection); heavy: pulls torch/transformers
markllm = ["markllm==0.1.5"]

[project.scripts]
ai-wm = "ai_watermark_toolkit.cli:main_entry"

[project.urls]
Homepage = "https://github.com/erikgieske/text-watermark-studio"
Documentation = "https://github.com/erikgieske/text-watermark-studio"
Repository = "https://github.com/erikgieske/text-watermark-studio"
Issues = "https://github.com/erikgieske/text-watermark-studio/issues"
Changelog = "https://github.com/erikgieske/text-watermark-studio/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "B",
  "C4",
  "UP",
  "S",
  "A",
  "C90",
  "RET",
  "SIM",
  "T20",
  "TRY",
  "RUF",
]
ignore = [
  "S101",
  "S603",
  "S607",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S311", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
